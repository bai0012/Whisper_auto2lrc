name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check core.py main.py api.py cli.py version.py tests

      - name: Compile Python entry points
        run: python -m py_compile core.py main.py api.py cli.py version.py

      - name: Run unit tests
        run: python -m pytest -s tests

      - name: Verify headless CLI import
        run: python -c "import cli, sys; assert not {'PyQt6', 'fastapi', 'uvicorn'} & sys.modules.keys()"
