name: Build and Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install pinned release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-release.txt
          python -m pip install -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check main.py api.py tests

      - name: Run unit tests
        run: python -m pytest -s tests

      - name: Build onedir application
        run: >-
          pyinstaller
          --noconfirm
          --clean
          --onedir
          --windowed
          --name Whisper_auto2lrc
          --collect-all whisper
          --collect-all faster_whisper
          --collect-all ctranslate2
          --collect-all tiktoken
          --collect-all av
          --collect-submodules tiktoken_ext
          --hidden-import tiktoken_ext.openai_public
          main.py

      - name: Smoke-test packaged application
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/Whisper_auto2lrc/Whisper_auto2lrc.exe"
          $archive = pyi-archive_viewer -l $exe | Out-String
          if ($archive -notmatch "main") {
            throw "Packaged executable does not contain the application entry point."
          }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            throw "Packaged application exited during its startup smoke test."
          }
          Stop-Process -Id $process.Id -Force

      - name: Create Windows ZIP
        shell: pwsh
        run: >-
          Compress-Archive
          -Path dist/Whisper_auto2lrc/*
          -DestinationPath dist/Whisper_auto2lrc-windows-x64.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          files: dist/Whisper_auto2lrc-windows-x64.zip
